<title>TriRoute</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap&subset=cyrillic">
<style>
/* Layout: full-bleed tilted world map; glass HUD floats on the edges — rail left, inspector right, status bar bottom, windows dock beside the rail. Single dark visual world. */
:root{
  color-scheme: dark;
  --bg:#05090e;
  --glass:rgba(11,17,25,.66);
  --glass-hi:rgba(20,29,40,.78);
  --glass-lo:rgba(8,12,18,.5);
  --line:rgba(146,186,214,.16);
  --line-hi:rgba(146,186,214,.32);
  --fg:#e7eef4;
  --fg-2:#b3c2cf;
  --muted:#7d8e9e;
  --accent:#5cc8f2;
  --accent-ink:#04131c;
  --accent-soft:rgba(92,200,242,.14);
  --warm:#f0a347;
  --good:#5bd492;
  --warn:#f1c453;
  --bad:#f0625f;
  --shadow:0 18px 44px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.35);
  --f-display:"Unbounded","Onest",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --blur:blur(18px) saturate(150%);
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;user-select:none}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ic.fill{fill:currentColor;stroke:none}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.acc{color:var(--accent)}.mut{color:var(--muted)}

/* ---------- glass ---------- */
.glass{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--line);box-shadow:var(--shadow)}
.lbl{font:600 10px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

#gl{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
#gl.drag{cursor:grabbing}
#overlay{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#ovsvg{position:absolute;inset:0;width:100%;height:100%}
.clabel{position:absolute;left:0;top:0;transform-origin:50% 50%;white-space:nowrap;font:600 12px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:#f4f8fb;text-shadow:0 1px 2px rgba(0,0,0,.9),0 0 10px rgba(0,0,0,.55);pointer-events:none}
.clabel.me{color:#fff}
.clabel.me::after{content:"";display:block;height:2px;margin:4px auto 0;width:60%;background:var(--accent)}
.cap{position:absolute;left:0;top:0;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;background:#fff;border:1.5px solid #0a1118;transform:rotate(45deg)}
.mk{position:absolute;left:0;top:0;width:26px;height:26px;margin:-13px 0 0 -13px;display:grid;place-items:center;background:rgba(10,14,20,.85);border:1px solid var(--bad);color:var(--bad)}
.mk .ic{width:15px;height:15px}
.mk::before{content:"";position:absolute;inset:-6px;border:1px solid currentColor;animation:pulse 1.8s ease-out infinite;opacity:0}
.mk.good{border-color:var(--good);color:var(--good)}
.mk.warn{border-color:var(--warn);color:var(--warn)}
@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.6);opacity:0}}

/* ---------- top-left identity ---------- */
#top{position:fixed;left:max(14px,env(safe-area-inset-left,0px));top:14px;right:max(14px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:8px;z-index:20;pointer-events:none}
#top>*{pointer-events:auto}
#idbox{display:flex;gap:8px;align-items:stretch}
#idbox .year{padding:10px 14px;font:600 20px/1 var(--f-display);display:flex;align-items:center}#idbox .year.grbox{padding:0;width:62px;justify-content:center;cursor:help}
#idbox .who{display:flex;align-items:center;gap:12px;padding:8px 14px 8px 8px;cursor:pointer}
#idbox .who img{width:46px;height:30px;display:block;border:1px solid var(--line-hi)}
#idbox .who b{display:block;font:600 14px/1.1 var(--f-display);letter-spacing:.04em}
#idbox .who small{display:block;color:var(--muted);font-size:12px;margin-top:3px}


/* ---------- KPI strip ---------- */
#kpis{display:flex}
#kpis[hidden]{display:none!important}
#bar .cell.dd-cell{cursor:default}
#bar .cell .dd{min-width:160px;margin-top:4px}
#bar .cell .dd>button{height:26px;font-size:12px}
.kpi{padding:8px 12px;border-right:1px solid var(--line);min-width:84px;cursor:help}
.kpi:last-child{border-right:0}
.kpi .v{font:600 15px/1.2 var(--f-mono);font-variant-numeric:tabular-nums;margin-top:5px;white-space:nowrap}
.kpi .d{font:500 11px/1 var(--f-mono);margin-left:4px}

/* ---------- rail ---------- */
#rail{position:fixed;left:max(14px,env(safe-area-inset-left,0px));top:84px;max-height:calc(100% - 180px);overflow-y:auto;overflow-x:hidden;scrollbar-width:none;display:flex;flex-direction:column;z-index:25;padding:4px}
#rail::-webkit-scrollbar{display:none}
.rbtn{position:relative;width:44px;height:40px;flex:none;display:grid;place-items:center;background:none;border:0;color:var(--fg-2);cursor:pointer}
.rbtn .ic{width:20px;height:20px}
.rbtn:hover{background:var(--accent-soft);color:var(--fg)}
.rbtn.on{background:var(--accent);color:var(--accent-ink)}
.rbtn.locked{color:var(--muted)}
.rbtn .badge{position:absolute;top:5px;right:4px;min-width:16px;height:16px;padding:0 4px;background:var(--bad);color:#fff;font:600 10px/16px var(--f-mono);text-align:center}
.rsep{height:1px;background:var(--line);margin:4px 6px}

/* ---------- inspector ---------- */
#insp{position:fixed;right:max(14px,env(safe-area-inset-right,0px));top:84px;max-height:calc(100% - 170px);width:330px;z-index:20;display:flex;flex-direction:column}
#insp[hidden]{display:none!important}
.ihead{display:flex;align-items:center;gap:10px;padding:14px 14px 10px}
.ihead h2{margin:0;font:600 19px/1.1 var(--f-display);letter-spacing:.03em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.xbtn{width:30px;height:30px;display:grid;place-items:center;background:none;border:1px solid transparent;color:var(--muted);cursor:pointer}
.xbtn:hover{border-color:var(--line-hi);color:var(--fg)}
.tabs{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--line)}
.tab{padding:9px 9px 10px;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer;font:500 12px/1 var(--f-body);white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--fg);border-bottom-color:var(--accent)}
.ibody{flex:1 1 auto;min-height:0;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}

/* blocks inside panels */
.blk{background:var(--glass-lo);border:1px solid var(--line);padding:12px}
.blk>.lbl:first-child{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:baseline}
.kv dt{color:var(--fg-2)}
.kv dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.flagrow{display:flex;gap:12px;align-items:center}
.flagrow img{width:84px;height:56px;border:1px solid var(--line-hi);display:block}
.big{font:600 30px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.meter{height:6px;background:rgba(255,255,255,.07);position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.sp{justify-content:space-between}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 7px;border:1px solid var(--line-hi);font:500 11px/1.2 var(--f-body);color:var(--fg-2);white-space:nowrap}
.pill.good{border-color:rgba(91,212,146,.45);color:var(--good)}
.pill.bad{border-color:rgba(240,98,95,.45);color:var(--bad)}
.pill.warn{border-color:rgba(241,196,83,.45);color:var(--warn)}
.pill.acc{border-color:rgba(92,200,242,.5);color:var(--accent)}
.pill .ic{width:13px;height:13px}
.note{color:var(--fg-2);font-size:13px}
.hint{display:flex;gap:10px;padding:10px 12px;background:rgba(92,200,242,.07);border:1px solid rgba(92,200,242,.22);color:var(--fg-2);font-size:13px}
.hint .ic{color:var(--accent);margin-top:1px}
.hint b{color:var(--fg)}
.myth{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:10px 12px;border:1px solid var(--line);background:var(--glass-lo);font-size:13px}
.myth .m{color:var(--bad);font:600 10px/1.7 var(--f-mono);letter-spacing:.1em}
.myth .f{color:var(--good);font:600 10px/1.7 var(--f-mono);letter-spacing:.1em}
.myth s{color:var(--fg-2);text-decoration:line-through;text-decoration-color:rgba(240,98,95,.6)}

/* ---------- buttons & controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 13px;background:rgba(255,255,255,.04);border:1px solid var(--line-hi);color:var(--fg);cursor:pointer;font:500 13px/1 var(--f-body);white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover,#ucard .btn.hov{background:var(--accent-soft);border-color:var(--accent)}#ucard .ucopen.hov{background:rgba(4,9,14,.55);border-color:var(--line)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.1)}
.btn.dng{border-color:rgba(240,98,95,.5);color:#ffb3b1}
.btn.dng:hover{background:rgba(240,98,95,.15);border-color:var(--bad)}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn:disabled{opacity:.62;cursor:not-allowed;filter:none;background:rgba(255,255,255,.03);border-color:var(--line)}
.btn .ic{width:16px;height:16px}
.seg{display:inline-flex;border:1px solid var(--line-hi)}
.seg button{height:30px;padding:0 10px;background:none;border:0;border-right:1px solid var(--line);color:var(--fg-2);cursor:pointer;font:500 12px/1 var(--f-body);display:inline-flex;align-items:center;gap:6px}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--fg);background:var(--accent-soft)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}

/* custom dropdown */
.dd{position:relative;min-width:150px}
.dd>button{width:100%;height:34px;display:flex;align-items:center;gap:8px;padding:0 10px;background:rgba(255,255,255,.04);border:1px solid var(--line-hi);cursor:pointer;text-align:left;font:500 13px/1 var(--f-body)}
.dd>button:hover{border-color:var(--accent)}
.dd>button span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd>button .ic:last-child{width:14px;height:14px;color:var(--muted)}
.ddlist{position:fixed;z-index:200;max-height:300px;overflow:auto;background:var(--glass-hi);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--line-hi);box-shadow:var(--shadow);padding:4px}
.ddlist div{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;font-size:13px;color:var(--fg-2)}
.ddlist div:hover,.ddlist div.on{background:var(--accent-soft);color:var(--fg)}
.ddlist div.on{box-shadow:inset 2px 0 0 var(--accent)}
.ddlist div small{margin-left:auto;color:var(--muted);font-family:var(--f-mono)}
.ddlist img{width:20px;height:13px}

/* slider */
.rng{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:none;cursor:pointer}
.rng::-webkit-slider-runnable-track{height:4px;background:linear-gradient(90deg,var(--accent) var(--p,50%),rgba(255,255,255,.12) var(--p,50%))}
.rng::-moz-range-track{height:4px;background:rgba(255,255,255,.12)}
.rng::-moz-range-progress{height:4px;background:var(--accent)}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5px;background:var(--fg);border:2px solid var(--accent)}
.rng::-moz-range-thumb{width:12px;height:12px;border-radius:0;background:var(--fg);border:2px solid var(--accent)}
/* toggle */
.tg{position:relative;width:38px;height:20px;flex:none;background:rgba(255,255,255,.08);border:1px solid var(--line-hi);cursor:pointer;padding:0}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;background:var(--muted);transition:left .15s,background .15s}
.tg.on{background:var(--accent-soft);border-color:var(--accent)}
.tg.on::after{left:20px;background:var(--accent)}

/* ---------- window ---------- */
#win{position:fixed;left:calc(max(14px,env(safe-area-inset-left,0px)) + 64px);top:84px;max-height:calc(100% - 170px);width:min(760px,calc(100vw - 460px));z-index:30;display:flex;flex-direction:column}
#win[hidden]{display:none!important}
.whead{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.whead .wic{width:54px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink)}
.whead .wic .ic{width:22px;height:22px}
.whead .wt{flex:1;padding:12px 16px;min-width:0}
.whead h3{margin:4px 0 0;font:600 18px/1.15 var(--f-display);letter-spacing:.02em}
.whead .xbtn{align-self:center;margin-right:10px}
.wbody{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.wbody>*,.ibody>*,.mb>*{flex-shrink:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--glass-lo);border:1px solid var(--line);padding:10px 12px;cursor:help}
.stat .v{font:600 19px/1.2 var(--f-mono);font-variant-numeric:tabular-nums;margin-top:6px}
.stat .s{font-size:12px;color:var(--muted);margin-top:2px}
.sect{display:flex;align-items:center;gap:10px;margin-top:4px}
.sect h4{margin:0;font:600 13px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.sect::after{content:"";flex:1;height:1px;background:var(--line)}

/* list rows */
.lrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;background:var(--glass-lo);border:1px solid var(--line)}
.lrow:hover{border-color:var(--line-hi)}
.lrow .icb{width:36px;height:36px;display:grid;place-items:center;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--accent)}
.lrow .t{font-weight:600}
.lrow .s{font-size:12px;color:var(--muted);margin-top:2px}
.lrow.on{border-color:rgba(92,200,242,.5);background:rgba(92,200,242,.06)}

table.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th{font:600 10px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line)}
.tb td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tb td.r,.tb th.r{text-align:right}
.tb tr:hover td{background:rgba(255,255,255,.025)}
.tbwrap{overflow-x:auto}

/* charts */
.chart{position:relative}
.chart canvas{display:block;width:100%}
.ctip{position:absolute;pointer-events:none;background:var(--glass-hi);border:1px solid var(--line-hi);padding:5px 8px;font:500 11px/1.3 var(--f-mono);white-space:nowrap;transform:translate(-50%,-110%)}

/* ---------- bottom bar ---------- */
#bar{position:fixed;left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));bottom:14px;height:60px;z-index:20;display:flex;align-items:stretch}
#bar .cell{padding:9px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;cursor:help;white-space:nowrap}
#bar .cell .v{font:600 16px/1.2 var(--f-mono);margin-top:4px;font-variant-numeric:tabular-nums}
#speed{display:flex;align-items:center;gap:2px;padding:0 10px;border-right:1px solid var(--line)}
#speed button{width:34px;height:34px;display:grid;place-items:center;background:none;border:1px solid transparent;color:var(--fg-2);cursor:pointer}
#speed button:hover{border-color:var(--line-hi)}
#speed button.on{background:var(--accent);color:var(--accent-ink)}
#ticker{flex:1;min-width:0;overflow:hidden;position:relative;display:flex;align-items:center;mask-image:linear-gradient(90deg,transparent,#000 30px,#000 calc(100% - 30px),transparent)}
#ticker .tr{display:flex;gap:28px;white-space:nowrap;padding-left:20px;will-change:transform}
#ticker .ti{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--fg-2)}
#ticker .ti i{width:7px;height:7px;background:var(--muted);display:inline-block}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ---------- toasts / tooltip / modal ---------- */
#toasts{position:fixed;right:max(358px,calc(env(safe-area-inset-right,0px) + 358px));top:84px;z-index:60;display:flex;flex-direction:column;gap:8px;width:320px;pointer-events:none}
#insp[hidden]~#toasts{right:max(14px,env(safe-area-inset-right,0px))}
.toast{display:flex;gap:10px;padding:10px 12px;pointer-events:auto;animation:tin .25s ease-out;border-left:3px solid var(--accent)}
.toast.bad{border-left-color:var(--bad)}.toast.good{border-left-color:var(--good)}.toast.warn{border-left-color:var(--warn)}
.toast b{display:block;font-size:13px}
.toast span{font-size:12px;color:var(--fg-2)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
#tip{position:fixed;z-index:300;max-width:300px;padding:10px 12px;background:var(--glass-hi);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--line-hi);box-shadow:var(--shadow);font-size:12.5px;line-height:1.45;color:var(--fg-2);pointer-events:none}
#tip b{color:var(--fg);display:block;margin-bottom:3px;font-size:13px}
#tip .tl{display:block;margin-top:6px;padding-top:6px;border-top:1px solid var(--line);color:var(--accent);font-size:12px}

#modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:rgba(2,5,9,.55);padding:16px}
#modal[hidden]{display:none!important}
.mbox{width:min(560px,100%);max-height:calc(100% - 20px);display:flex;flex-direction:column}
.mbox .mhead{display:flex;gap:14px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.mbox .mhead .mic{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line-hi);color:var(--accent)}
.mbox .mhead .mic.bad{color:var(--bad);border-color:rgba(240,98,95,.5)}
.mbox .mhead .mic.good{color:var(--good);border-color:rgba(91,212,146,.5)}
.mbox .mhead .mic.warn{color:var(--warn);border-color:rgba(241,196,83,.5)}
.mbox .mhead .mic .ic{width:22px;height:22px}
.mbox h3{margin:4px 0 0;font:600 18px/1.2 var(--f-display)}
.mbox .mb{padding:16px 18px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.mbox .mb p{margin:0;color:var(--fg-2)}
.choice{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;padding:11px 13px;background:rgba(255,255,255,.035);border:1px solid var(--line-hi);cursor:pointer}
.choice:hover{border-color:var(--accent);background:var(--accent-soft)}.choice.hl{border-color:var(--accent)}
.choice b{font-size:14px}
.choice span{font-size:12px;color:var(--muted)}
.choice:disabled{opacity:.45;cursor:not-allowed}

/* ---------- start screen ---------- */
body.preview #gl,body.preview #overlay{filter:blur(5px)}
#gl{transition:filter .6s}
body.preview #start{background:radial-gradient(1000px 600px at 50% 45%,rgba(3,6,10,.15),rgba(3,6,10,.55) 75%),rgba(3,6,10,.28)}
#start{position:fixed;inset:0;z-index:150;display:grid;place-items:center;background:radial-gradient(1200px 700px at 70% 30%,rgba(92,200,242,.10),transparent 60%),rgba(3,6,10,.72);padding:16px}
#start[hidden]{display:none!important}
#start{display:block;padding:0;background:linear-gradient(90deg,rgba(3,6,10,.5),rgba(3,6,10,.12) 45%,rgba(3,6,10,.05))!important}
.scol{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100% - 32px));display:flex;flex-direction:column;gap:12px;max-height:calc(100% - 32px)}
